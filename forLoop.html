let numbers = [3, 4, -1, 1, 2, 6];
let positiveNumbers = [];
for (let i = numbers.length - 1; i >= 0; i--) {
    if (numbers[i] > 0) {
        positiveNumbers[positiveNumbers.length] = numbers[i];
    }
}
console.log(positiveNumbers);
let missingNumber = 1;
for (let i = 0; i < positiveNumbers.length; i++) {
    if (positiveNumbers[0] === positiveNumbers[i]) {
        continue;
    } else {
        missingNumber = positiveNumbers[0] + 1;
        break;
    }
}
