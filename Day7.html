<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7 </title>
</head>
<body>
    
    
    <script>

     console.log(" ");
     
     console.log("TASK 1 – CALLBACK");
     
    const calculate =(a,b,cb)=>{
      let result = a+b
      cb(result)
    }
    const output =(result)=>{
      console.log("Result: ", result);
      
    }
    calculate(2,3,output)


   const checkNumber =(num)=>{
    return new Promise((resolve, reject)=>{
        if(num>10){
            resolve("Valid Number")
        }
        else{
            reject("Invalid Number")
        }
    })
   }
   checkNumber(17)
   .then((result)=>{
    console.log(result);
    })
    .catch((error)=>{
        console.log(error);
        
    })


    console.log(" ");
     
     console.log("TASK 2 – PROMISE - TASK 3 – ASYNC / AWAIT");
    const verifyNumber =async()=>{
        try{
            const result = await checkNumber(2)
            console.log(result);
        }
        catch(error){
          console.log(error);
        }
    }
    verifyNumber()
    </script>
</body>
</html>
