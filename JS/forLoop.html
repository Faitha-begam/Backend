//--------------------------- Day 26 for loop ----------------------------------------
// Interleave Two Lists
let teamA = ["A1", "A2", "A3", "A4"];
let teamB = ["B1", "B2", "B3", "B4"];
let result = [];
let maxLength;

if (teamA.length > teamB.length) {
    maxLength = teamA.length;
} else {
    maxLength = teamB.length;
}
for (let i = 0; i < maxLength; i++) {
    if (i < teamA.length) {
        result[result.length] = teamA[i];
    }

    if (i < teamB.length) {
        result[result.length] = teamB[i];
    }
}

console.log(result);

// create two arrays, create an empty result array
// find which array has the greater length and store it in maxLength
// loop from 0 to maxLength
// if teamA has an element at the current index, add it to result
// then check teamB at the same index and add it
// the two if conditions allow the program to work even when the arrays have different lengths
// the final result alternates between Team A and Team B while preserving their original order

//--------------------------- Day 27 for loop ----------------------------------------
let numbers = [4, 7, 2, 4, 9, 2, 7]
let uniqueNumber
for (let i = 0; i < numbers.length; i++) {
    let count = 0
    for (let j = 0; j < numbers.length; j++) {
        if (numbers[i] === numbers[j]) {
            count++
        }
    }
    if (count === 1) {
        uniqueNumber = numbers[i]
        break;
    }
}
console.log("Unique number:", uniqueNumber);

// create uniqueNumber to store the number that appears only once
// use the outer loop to select each number
// set count to 0 for the selected number
// use the inner loop to compare it with every number in the array
// if both numbers are equal, increase count
// after checking all elements, check whether count === 1
// if true, that number appears only once
// store it in uniqueNumber
// use break because we found the required number
